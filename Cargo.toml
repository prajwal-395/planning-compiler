[workspace]
resolver = "2"
members = [
    "crates/pc-ir",
    "crates/pc-core",
    "crates/pc-select",
    "crates/pc-store",
    "crates/pc-adapter-tasks-axi",
    "crates/pc-adapter-beads",
    "crates/pc-sync",
    "crates/pc-cli",
    "crates/pc-discovery",
    "crates/pc-mcp",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.lints.clippy]
all = "warn"
correctness = "warn"
suspicious = "warn"
complexity = "warn"
perf = "warn"
style = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.dependencies]
pc-ir = { path = "crates/pc-ir", version = "0.1.0" }
pc-core = { path = "crates/pc-core", version = "0.1.0" }
pc-select = { path = "crates/pc-select", version = "0.1.0" }
pc-store = { path = "crates/pc-store", version = "0.1.0" }
pc-adapter-tasks-axi = { path = "crates/pc-adapter-tasks-axi", version = "0.1.0" }
pc-adapter-beads = { path = "crates/pc-adapter-beads", version = "0.1.0" }
pc-sync = { path = "crates/pc-sync", version = "0.1.0" }
pc-discovery = { path = "crates/pc-discovery", version = "0.1.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", features = ["parse", "display"] }
schemars = "0.8"
petgraph = "0.8"
good_lp = { version = "1.15", default-features = false, features = ["microlp"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
blake3 = "1.5"

assert_cmd = "2.0"
insta = "1.41"
proptest = "1.7"
predicates = "3.1"
criterion = "0.5"
