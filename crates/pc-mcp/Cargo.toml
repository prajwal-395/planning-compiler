[package]
name = "pc-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pc-mcp"
path = "src/main.rs"

[lib]
name = "pc_mcp"
path = "src/lib.rs"

[dependencies]
pc-core.workspace = true
pc-store.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
rmcp = { version = "=3.5.1", features = ["server", "transport-io", "macros", "schemars"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
rmcp = { version = "=3.5.1", features = ["server", "client", "transport-io", "transport-child-process", "macros", "schemars"] }

[lints]
workspace = true
