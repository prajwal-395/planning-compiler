ir_version = 0

[plan]
id = "self-plan"
title = "planning-compiler implementation plan"
description = "Self-plan: steps 0-7 and PR 8 gap fixes shipped; step 8 retains the Ren retrospective; the live Ren cycle is PC-06. The 2026-10-13 evaluation policy (docs/evidence/dogfood.md) makes continuous-validation an ongoing process outside the decomposition; it does not satisfy or rewrite the original two-week criteria. Post-MVP and PC-02..PC-18 work proceed according to their explicit dependencies. PR open-to-merge times are absolute duration evidence on capability:crewmate@1."

[objective]
root_task = "ship-compiler"
weights = { duration_minutes = 1.0, failure_risk = 2.0, money_usd = 0.5 }
budget_usd = 1000.0
deadline = "2026-12-31"
quality_floor = 0.8

[[objective.acceptance]]
kind = "command"
description = "Workspace tests pass on every commit."
command = "cargo test --workspace"

[[objective.acceptance]]
kind = "manual"
description = "Steps 0-1 release is tagged and usable on its own."

[[objective.acceptance]]
kind = "metric"
description = "Checking the self-plan stays fast."
metric = "duration_minutes"
op = "<="
value = 5.0

[[objective.acceptance]]
kind = "manual"
description = "Step 8 proves the compiler changes or catches a real decision at a maintenance cost below what it saves (docs/evidence/dogfood.md)."

